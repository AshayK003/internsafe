name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile app.py rules.py scam.py test_rules.py test_scam.py blackbox_test.py

      - name: Run rule engine tests
        run: python test_rules.py

      - name: Run legacy tests
        run: python test_scam.py

      - name: Run black-box tests
        run: python blackbox_test.py
